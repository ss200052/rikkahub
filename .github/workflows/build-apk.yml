name: Build RikkaHub APK

# 基于 3.1.0 的自助打包：手动触发，产出一个可直接安装的 release APK。
# 跳过 web-ui 的前端构建（内置网页服务用不了，聊天功能不受影响），
# 这样 CI 里不需要 Node/pnpm，构建更快也更稳。
#
# 签名用的是仓库里 .github/rikka.jks.b64 还原出来的固定密钥，
# 所以每次构建的签名都一样 —— 新包可以直接覆盖安装，数据不会丢。
#
# ⚠ 该密钥是公开的（仓库为 public）。它只用于这个私人魔改版的自签名，
#   不要拿去给任何会被分发或上架的东西签名。

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 3.1.0 的官方 CI 用 21，AGP 9.4 + Gradle 9.6 按这条路径验证过
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            printf '%s' '{"project_info":{"project_number":"0","project_id":"rikkahub","storage_bucket":"rikkahub.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"me.rerere.rikkahub.mine"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      # 固定签名：从仓库里的 base64 还原，保证每次构建签名一致，可直接覆盖升级
      - name: Restore keystore
        run: |
          base64 -d .github/rikka.jks.b64 > app/app.key
          ls -l app/app.key

      - name: Write signing config
        run: |
          printf 'storeFile=app.key\nstorePassword=rikkahub123\nkeyAlias=rikka\nkeyPassword=rikkahub123\n' > local.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          # 3.1.1 起有 github / play 两个渠道，只打 github 那条
          ./gradlew :app:assembleGithubRelease -x :web:buildWebUi --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-apk
          # 渠道化之后产物在 apk/<flavor>/release/ 下
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
