name: Build RikkaHub APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            printf '%s' '{"project_info":{"project_number":"0","project_id":"rikkahub","storage_bucket":"rikkahub.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"me.rerere.rikkahub"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/app.key \
            -alias rikka \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass rikkahub123 -keypass rikkahub123 \
            -dname "CN=Rikka, OU=Dev, O=Personal, L=City, S=State, C=CN"

      - name: Write signing config
        run: |
          printf 'storeFile=app.key\nstorePassword=rikkahub123\nkeyAlias=rikka\nkeyPassword=rikkahub123\n' > local.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -x :web:buildWebUI --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
